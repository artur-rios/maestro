name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-24.04
    outputs:
      semantic_version: ${{ steps.version.outputs.semantic_version }}
      core_version: ${{ steps.version.outputs.core_version }}
      windows_version: ${{ steps.version.outputs.windows_version }}
      debian_version: ${{ steps.version.outputs.debian_version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - id: version
        run: dart tooling/release/validate_release_tag.dart "$GITHUB_REF_NAME" "$GITHUB_OUTPUT"

  windows-package:
    needs: validate-release
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: |
          $compiler = tooling/packaging/windows/install_inno_setup.ps1 -Destination "$env:RUNNER_TEMP/inno-setup"
          "INNO_SETUP_COMPILER=$compiler" >> $env:GITHUB_ENV
      - name: Package Windows
        shell: pwsh
        run: |
          tooling/packaging/package_windows.ps1 `
            -SemanticVersion "${{ needs['validate-release'].outputs.semantic_version }}" `
            -CoreVersion "${{ needs['validate-release'].outputs.core_version }}" `
            -WindowsVersion "${{ needs['validate-release'].outputs.windows_version }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-packages
          path: |
            dist/maestro-windows-x64.zip
            dist/maestro-windows-x64.msix
            dist/maestro-windows-x64-setup.exe
          if-no-files-found: error

  linux-package:
    needs: validate-release
    runs-on: ubuntu-24.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
      APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      # libsqlite3-dev is required to link the sqlite3 native assets; without it
      # the Linux release build depends on the runner image supplying them.
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libsqlite3-dev libjsoncpp-dev libayatana-appindicator3-dev
      - run: flutter pub get
      - name: Install pinned appimagetool
        run: |
          curl --fail --location --output "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "$APPIMAGETOOL_SHA256  $RUNNER_TEMP/appimagetool" | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL_PATH=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
      - run: |
          bash tooling/packaging/package_linux.sh \
            "${{ needs['validate-release'].outputs.semantic_version }}" \
            "${{ needs['validate-release'].outputs.core_version }}" \
            "${{ needs['validate-release'].outputs.debian_version }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-packages
          path: |
            dist/maestro-linux-x64.AppImage
            dist/maestro-linux-amd64.deb
          if-no-files-found: error

  release:
    needs: [validate-release, windows-package, linux-package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      MAESTRO_RELEASE_SECRET_KEY_BASE64: ${{ secrets.MAESTRO_RELEASE_SECRET_KEY_BASE64 }}
      MAESTRO_RELEASE_PUBLIC_KEY_BASE64: ${{ secrets.MAESTRO_RELEASE_PUBLIC_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-packages'
          path: dist
          merge-multiple: true
      - run: flutter pub get
      - name: Create and optionally sign release manifest
        run: |
          dart run tooling/release/create_manifest.dart dist "${{ needs['validate-release'].outputs.semantic_version }}" "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/"
          if [[ -n "$MAESTRO_RELEASE_SECRET_KEY_BASE64" && -n "$MAESTRO_RELEASE_PUBLIC_KEY_BASE64" ]]; then
            dart run tooling/release/sign_manifest.dart dist
          elif [[ -z "$MAESTRO_RELEASE_SECRET_KEY_BASE64" && -z "$MAESTRO_RELEASE_PUBLIC_KEY_BASE64" ]]; then
            echo 'publisher-signing: unconfigured'
          else
            echo 'publisher-signing: incomplete signing material' >&2
            exit 1
          fi
          dart run tooling/release/verify_release.dart dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ needs['validate-release'].outputs.is_prerelease }}
          files: dist/*
          fail_on_unmatched_files: true
