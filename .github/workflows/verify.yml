name: Verify

# The analyze-and-test gate, factored out so the release pipeline runs exactly
# the same checks CI runs. A tag that skips this gate would publish a commit
# nothing verified.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  analyze-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Install Linux test prerequisites
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libsecret-1-dev
      - run: flutter pub get
      - run: dart run build_runner build
      - run: git diff --exit-code
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_support tooling
      - run: dart run tooling/verify_architecture.dart
      - run: dart run tooling/verify_workflows.dart
      - run: flutter analyze
      - run: flutter test --coverage
