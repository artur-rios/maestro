name: CI

# The Windows job, which stays on GitHub Actions: Jenkins runs the Linux checks analyze-test and linux-platform
# (yggdrasil.yml, from ci/) and copies this job's result ("windows-platform", the catalog's actionsCheck) onto the
# Forgejo commit.
#
# Every branch the mirror pushes: Jenkins copies the result onto the Forgejo pull request by its head commit, and
# pull requests exist only on Forgejo. No pull_request trigger (it never fires on the mirror) and no paths filter (a
# commit the filter skips has no run, so its status stays pending).
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

# A newer commit supersedes an in-flight run for the same branch, whose earlier result would never be judged on.
# Runs on develop and main are never cancelled: a superseded run leaves that commit with no verification at all,
# which is how UC-05 reached main without a completed check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}

jobs:
  windows-platform:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test integration_test/platform/process_tree_integration_test.dart -d windows
      - run: flutter test integration_test/platform/detached_process_launcher_integration_test.dart -d windows --dart-define=MAESTRO_TEST_DART="$env:FLUTTER_ROOT\bin\cache\dart-sdk\bin\dart.exe"
      - run: flutter test integration_test/foundation_startup_integration_test.dart -d windows
      - run: flutter test integration_test/performance/concurrent_streams_integration_test.dart -d windows
      - run: flutter test integration_test/performance/run_observation_integration_test.dart -d windows
      - run: flutter test integration_test/terminal/embedded_terminal_integration_test.dart -d windows
      - run: flutter test integration_test/projects/git_project_validation_integration_test.dart -d windows
      - run: flutter test integration_test/projects/project_lifecycle_non_ownership_integration_test.dart -d windows
      - run: flutter test integration_test/workflows/workflow_design_persistence_integration_test.dart -d windows
      - run: flutter test integration_test/workflows/step_agent_process_integration_test.dart -d windows
      - run: flutter build windows --release
      - name: Install and recreate pinned Inno Setup compiler
        shell: pwsh
        run: |
          $compiler = tooling/packaging/windows/install_inno_setup.ps1 -Destination "$env:RUNNER_TEMP/inno-setup"
          $trustedHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $compiler).Hash
          Set-Content -LiteralPath $compiler -Value 'corrupt compiler'
          $compiler = tooling/packaging/windows/install_inno_setup.ps1 -Destination "$env:RUNNER_TEMP/inno-setup"
          $recreatedHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $compiler).Hash
          if ($recreatedHash -ne $trustedHash) { throw 'Pinned Inno Setup compiler was not recreated.' }
          Write-Output 'windows-inno-bootstrap: corrupted compiler recreated'
          "INNO_SETUP_COMPILER=$compiler" >> $env:GITHUB_ENV
      - name: Package Windows artifacts
        shell: pwsh
        run: tooling/packaging/package_windows.ps1 -SemanticVersion 0.1.0 -CoreVersion 0.1.0 -WindowsVersion 0.1.0.65535 -SkipBuild
      - name: Build ZIP update fixture
        shell: pwsh
        run: |
          $fixtureRoot = Join-Path $env:RUNNER_TEMP 'maestro-windows-x64-update'
          $updatePackage = Join-Path $env:RUNNER_TEMP 'maestro-windows-x64-update.zip'
          New-Item -ItemType Directory -Path $fixtureRoot -Force | Out-Null
          Expand-Archive -LiteralPath dist/maestro-windows-x64.zip -DestinationPath $fixtureRoot -Force
          Set-Content -LiteralPath (Join-Path $fixtureRoot 'zip-update-marker.txt') -Value 'zip-update'
          Compress-Archive -Path (Join-Path $fixtureRoot '*') -DestinationPath $updatePackage -Force
          "MAESTRO_WINDOWS_UPDATE_PACKAGE=$updatePackage" >> $env:GITHUB_ENV
      - name: Build custom-directory installer smoke fixtures
        shell: pwsh
        run: |
          tooling/packaging/windows/build_installer.ps1 `
            -DisplayVersion 0.1.0 `
            -WindowsVersion 0.1.0.65535 `
            -Bundle build/windows/x64/runner/Release `
            -OutputDirectory "$env:RUNNER_TEMP" `
            -OutputName maestro-windows-x64-setup-smoke-0.1.0 `
            -CompilerPath $env:INNO_SETUP_COMPILER `
            -AllowCustomDirectoryForSmoke
          tooling/packaging/windows/build_installer.ps1 `
            -DisplayVersion 0.1.1 `
            -WindowsVersion 0.1.1.65535 `
            -Bundle build/windows/x64/runner/Release `
            -OutputDirectory "$env:RUNNER_TEMP" `
            -OutputName maestro-windows-x64-setup-smoke-0.1.1 `
            -CompilerPath $env:INNO_SETUP_COMPILER `
            -AllowCustomDirectoryForSmoke
      - name: Smoke per-user setup install, upgrade, and uninstall
        shell: pwsh
        run: |
          tooling/smoke/windows_installer.ps1 `
            -ProductionInstaller dist/maestro-windows-x64-setup.exe `
            -InitialInstaller "$env:RUNNER_TEMP/maestro-windows-x64-setup-smoke-0.1.0.exe" `
            -UpgradeInstaller "$env:RUNNER_TEMP/maestro-windows-x64-setup-smoke-0.1.1.exe" `
            -UpdatePackage $env:MAESTRO_WINDOWS_UPDATE_PACKAGE `
            -WorkRoot "$env:RUNNER_TEMP/maestro-installer-smoke"
      - name: Smoke portable install and update staging
        shell: pwsh
        run: tooling/smoke/windows_install_update.ps1 -InitialPackage dist/maestro-windows-x64.zip -UpdatePackage dist/maestro-windows-x64.zip -WorkRoot "$env:RUNNER_TEMP/maestro-smoke"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-packages
          path: |
            dist/maestro-windows-x64.zip
            dist/maestro-windows-x64.msix
            dist/maestro-windows-x64-setup.exe
          if-no-files-found: error
