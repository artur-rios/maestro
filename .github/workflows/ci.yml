name: CI

on:
  pull_request:
  push:
    branches: [main, 'feature/**', 'fix/**', 'refactor/**', 'hotfix/**']

permissions:
  contents: read

jobs:
  analyze-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Install Linux test prerequisites
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libsecret-1-dev
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: git diff --exit-code
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_support tooling
      - run: dart run tooling/verify_architecture.dart
      - run: dart run tooling/verify_workflows.dart
      - run: flutter analyze
      - run: flutter test --coverage

  windows-platform:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test integration_test/platform/process_tree_integration_test.dart -d windows
      - run: flutter test integration_test/foundation_startup_integration_test.dart -d windows
      - run: flutter test integration_test/performance/concurrent_streams_integration_test.dart -d windows
      - run: flutter test integration_test/projects/git_project_validation_integration_test.dart -d windows
      - run: flutter test integration_test/projects/project_lifecycle_non_ownership_integration_test.dart -d windows
      - run: flutter test integration_test/workflows/workflow_design_persistence_integration_test.dart -d windows
      - run: flutter build windows --release
      - name: Package Windows artifacts
        shell: pwsh
        run: tooling/packaging/package_windows.ps1 -Version 0.1.0 -SkipBuild
      - name: Smoke portable install and update staging
        shell: pwsh
        run: tooling/smoke/windows_install_update.ps1 -InitialPackage dist/maestro-windows-x64.zip -UpdatePackage dist/maestro-windows-x64.zip -WorkRoot "$env:RUNNER_TEMP/maestro-smoke"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-packages
          path: |
            dist/maestro-windows-x64.zip
            dist/maestro-windows-x64.msix
          if-no-files-found: error

  linux-platform:
    runs-on: ubuntu-24.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
      APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Install Linux build prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev libayatana-appindicator3-dev dbus-x11 gnome-keyring xvfb
      - run: flutter pub get
      - run: xvfb-run -a flutter test integration_test/platform/process_tree_integration_test.dart -d linux
      - name: Run production startup integration with Secret Service
        run: |
          dbus-run-session -- bash -euc '
            printf "\n" | gnome-keyring-daemon --unlock
            xvfb-run -a flutter test integration_test/foundation_startup_integration_test.dart -d linux
          '
      - run: xvfb-run -a flutter test integration_test/performance/concurrent_streams_integration_test.dart -d linux
      - run: xvfb-run -a flutter test integration_test/projects/git_project_validation_integration_test.dart -d linux
      - run: xvfb-run -a flutter test integration_test/projects/project_lifecycle_non_ownership_integration_test.dart -d linux
      - run: xvfb-run -a flutter test integration_test/workflows/workflow_design_persistence_integration_test.dart -d linux
      - run: flutter build linux --release
      - name: Install pinned appimagetool
        run: |
          curl --fail --location --output "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "$APPIMAGETOOL_SHA256  $RUNNER_TEMP/appimagetool" | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL_PATH=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
      - run: bash tooling/packaging/package_linux.sh 0.1.0
      - run: bash tooling/smoke/linux_install_update.sh dist/maestro-linux-x64.AppImage dist/maestro-linux-amd64.deb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-packages
          path: |
            dist/maestro-linux-x64.AppImage
            dist/maestro-linux-amd64.deb
          if-no-files-found: error
