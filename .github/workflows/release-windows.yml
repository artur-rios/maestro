name: Release Windows

# The Windows files of a release (release.windows in yggdrasil.yml): the old release.yml's validate-release (the tag
# and its version projections) and windows-package jobs. Jenkins builds the Linux files from the release's tag
# (ci/release-build.sh), dispatches this workflow on the tag once the mirror has pushed it, waits for it and downloads
# the maestro-windows-packages artifact; ci/release-validate.sh then validates the whole set, and Jenkins publishes
# it. It is not a pull request check.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-windows-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  windows-package:
    runs-on: windows-2025
    env:
      # Stamped into the build so the shipped application can check, verify and
      # install signed updates. Unset variables leave the updater out of the
      # build; the packaging script reports which case applied.
      MAESTRO_RELEASE_PUBLIC_KEY_BASE64: ${{ secrets.MAESTRO_RELEASE_PUBLIC_KEY_BASE64 }}
      MAESTRO_RELEASE_MANIFEST_URL: ${{ vars.MAESTRO_RELEASE_MANIFEST_URL }}
      MAESTRO_RELEASE_SIGNATURE_URL: ${{ vars.MAESTRO_RELEASE_SIGNATURE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      # Only released code is published, and Jenkins has checked the tag is on main; this checks it is a version the
      # release tooling accepts, and projects the native versions from it.
      - id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: dart tooling/release/validate_release_tag.dart "$env:RELEASE_TAG" "$env:GITHUB_OUTPUT"
      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: |
          $compiler = tooling/packaging/windows/install_inno_setup.ps1 -Destination "$env:RUNNER_TEMP/inno-setup"
          "INNO_SETUP_COMPILER=$compiler" >> $env:GITHUB_ENV
      - name: Package Windows
        shell: pwsh
        run: |
          tooling/packaging/package_windows.ps1 `
            -SemanticVersion "${{ steps.version.outputs.semantic_version }}" `
            -CoreVersion "${{ steps.version.outputs.core_version }}" `
            -WindowsVersion "${{ steps.version.outputs.windows_version }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-windows-packages
          path: |
            dist/maestro-windows-x64.zip
            dist/maestro-windows-x64.msix
            dist/maestro-windows-x64-setup.exe
          if-no-files-found: error
